<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>YTStudio</title>
    <script>
      // Apply the saved theme and fonts before first paint to avoid a flash (`src/stores/theme.ts` checks them after).
      (function () {
        var root = document.documentElement;
        var choice = localStorage.getItem("editor-theme-choice") || localStorage.getItem("editor-theme") || "system";
        var dark = choice === "system" ? matchMedia("(prefers-color-scheme: dark)").matches : choice === "dark" || localStorage.getItem("editor-theme-dark") === "true";
        var theme = choice === "system" ? (dark ? "dark" : "light") : choice;
        root.classList.add("theme", "theme-" + theme);
        root.classList.toggle("dark", dark);
        var sans = localStorage.getItem("editor-font-stack");
        var mono = localStorage.getItem("editor-mono-font-stack");
        if (sans) root.style.setProperty("--font-sans", sans);
        if (mono) root.style.setProperty("--font-mono", mono);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
